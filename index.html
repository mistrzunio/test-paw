<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clock & Calendar PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d47a1">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="container">
    <p class="top-hint">the only calendar that matters :-)</p>

    <section class="card clock-card">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <!-- header removed; Today button will live inside the notable list -->
      </div>
      <div id="notableList" class="notable-list">
        <div class="notable-actions"><button id="todayBtn" class="btn">Today</button></div>
      </div>
    </section>

    <!-- settings removed -->

    <section class="card calendar-card">
      <div id="monthsContainer" class="months-container" tabindex="0"></div>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
