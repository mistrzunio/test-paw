<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Clock & Calendar PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d47a1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HowManyDays">
  <link rel="apple-touch-icon" href="src/icons/calicon-192.png">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="container">
    <p class="top-hint">...the only<br/> calendar that matters :-)</p>

    <section class="card clock-card">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <!-- header removed; Today button will live inside the notable list -->
      </div>
      <div id="notableList" class="notable-list">
        <div class="notable-actions"><button id="todayBtn" class="btn">Today</button></div>
      </div>
    </section>

    <!-- modal for adding notable labels -->
  <div id="notableModal" class="modal" aria-hidden="true" style="display:none">
      <div class="modal-backdrop"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h3 id="modalTitle">What's the big day?</h3>
    <input id="modalLabel" type="text" placeholder="Name it here" aria-label="Label for notable day" />
        <div style="display:flex;gap:8px;margin-top:8px;justify-content:flex-end">
          <button id="modalCancel" class="btn btn-ghost">Cancel</button>
          <button id="modalOk" class="btn">Add</button>
        </div>
      </div>
    </div>

    <!-- settings removed -->

    <section class="card calendar-card">
      <div id="monthsContainer" class="months-container" tabindex="0"></div>
    </section>
    <p class="hint">by mistrzunio (at) github</p>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
